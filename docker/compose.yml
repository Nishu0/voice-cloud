name: voice-cloud

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    init: true
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DB_PATH: /data/voice-cloud.db
      API_ADDR: 0.0.0.0:8080
    volumes:
      - database:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: production
    init: true
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      API_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  database:
